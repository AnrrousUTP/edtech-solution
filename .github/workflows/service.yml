# Workflow reusable por ci.yml. Verifica cada dominio, pero no vuelve a crear
# imágenes ni aplicar ECS. El camino de publicación serverless tendrá su propio
# gate después de la paridad funcional y la migración de datos.
name: Servicio

on:
  workflow_call:
    inputs:
      servicio:
        type: string
        required: true
      afectado:
        type: string
        required: true

jobs:
  verificar:
    if: inputs.afectado == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: edtech
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - if: inputs.servicio == 'affiliates' || inputs.servicio == 'enrollment-progress' || inputs.servicio == 'identity-access' || inputs.servicio == 'flashcards' || inputs.servicio == 'iot-terminals' || inputs.servicio == 'payments'
        name: Start DynamoDB Local integration tests
        run: |
          docker run -d --name edtech-dynamodb-local -p 8000:8000 amazon/dynamodb-local
          for attempt in $(seq 1 30); do
            if curl --silent http://localhost:8000 >/dev/null; then break; fi
            sleep 1
          done
          echo 'DYNAMODB_LOCAL_ENDPOINT=http://localhost:8000' >> "$GITHUB_ENV"
          echo 'AWS_ACCESS_KEY_ID=local' >> "$GITHUB_ENV"
          echo 'AWS_SECRET_ACCESS_KEY=local' >> "$GITHUB_ENV"
          echo 'AWS_DEFAULT_REGION=us-east-1' >> "$GITHUB_ENV"
      - if: inputs.servicio != 'web'
        run: bun test services/${{ inputs.servicio }} packages/shared-kernel
      - if: inputs.servicio != 'web'
        run: bunx tsc --noEmit -p services/${{ inputs.servicio }}
      - if: inputs.servicio == 'web'
        run: bunx tsc --noEmit -p apps/web
      - if: inputs.servicio == 'affiliates'
        run: bun run lambda:build affiliates
      - if: inputs.servicio == 'enrollment-progress'
        run: bun run lambda:build enrollment-progress
      - if: inputs.servicio == 'enrollment-progress'
        run: node tools/lambda/smoke-test-archive.mjs enrollment-progress
      - if: inputs.servicio == 'enrollment-progress'
        run: node tools/lambda/smoke-test-http-lambda.mjs enrollment-progress
      - if: inputs.servicio == 'affiliates'
        run: node tools/lambda/smoke-test-archive.mjs affiliates
      - if: inputs.servicio == 'identity-access'
        run: bun run lambda:build identity-access
      - if: inputs.servicio == 'identity-access'
        run: node tools/lambda/smoke-test-identity.mjs
      - if: inputs.servicio == 'flashcards'
        run: bun run lambda:build flashcards
      - if: inputs.servicio == 'flashcards'
        run: node tools/lambda/smoke-test-http-lambda.mjs flashcards
      - if: inputs.servicio == 'iot-terminals'
        run: bun run lambda:build iot-terminals
      - if: inputs.servicio == 'iot-terminals'
        run: node tools/lambda/smoke-test-archive.mjs iot-terminals
      - if: inputs.servicio == 'iot-terminals'
        run: node tools/lambda/smoke-test-http-lambda.mjs iot-terminals
      - if: inputs.servicio == 'payments'
        run: bun run lambda:build payments
      - if: inputs.servicio == 'payments'
        run: node tools/lambda/smoke-test-archive.mjs payments
      - if: inputs.servicio == 'payments'
        run: bun run lambda:build outbox
      - if: inputs.servicio == 'payments'
        run: node tools/lambda/smoke-test-archive.mjs outbox
      - if: inputs.servicio == 'payments'
        run: node tools/lambda/smoke-test-http-lambda.mjs payments
      - if: always() && (inputs.servicio == 'affiliates' || inputs.servicio == 'enrollment-progress' || inputs.servicio == 'identity-access' || inputs.servicio == 'flashcards' || inputs.servicio == 'iot-terminals' || inputs.servicio == 'payments')
        name: Stop DynamoDB Local integration tests
        run: docker rm -f edtech-dynamodb-local || true
