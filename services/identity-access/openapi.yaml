openapi: 3.0.3
info:
  title: identity-access-service
  version: 0.1.0
  description: >
    Perfil de usuario, rol de dominio y nivel A-N. La autenticación es de
    Cognito (D2); este servicio nunca ve contraseñas ni tokens de refresh.
servers:
  - url: /api/identity
paths:
  /me:
    get:
      summary: Perfil del usuario autenticado (alta perezosa si no existe)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilEnvelope' }
        '401': { description: Sin token o token inválido }
    put:
      summary: Actualizar el perfil propio
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nombreVisible: { type: string, minLength: 2, maxLength: 80 }
                avatarUrl: { type: string, nullable: true }
                pais: { type: string, pattern: '^[A-Z]{2}$', nullable: true }
                idioma: { type: string, pattern: '^[a-z]{2}$' }
      responses:
        '200': { description: Actualizado }
        '400': { description: Datos inválidos }
        '401': { description: Sin token }
  /usuarios/{id}:
    get:
      summary: Perfil de un usuario (solo admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilEnvelope' }
        '403': { description: Requiere rol admin }
        '404': { description: No existe }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    PerfilEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            nombreVisible: { type: string }
            avatarUrl: { type: string, nullable: true }
            pais: { type: string, nullable: true }
            idioma: { type: string }
            rol: { type: string, enum: [ESTUDIANTE, ADMIN] }
            nivel: { type: string, pattern: '^[A-N]$' }
            origenNivel: { type: string, enum: [TEST, AUTODECLARADO, PROGRESION] }
