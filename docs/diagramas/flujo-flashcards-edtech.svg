<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Generación y validación de flashcards EdTech</title>
  <desc id="desc">Flujo docente para solicitar, generar, seleccionar y publicar flashcards aprobadas para el repaso del estudiante.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#19324d" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#7593b2"/></marker>
    <style>
      .ink{fill:#142b42;font-family:Inter,Arial,sans-serif}.muted{fill:#61758d;font-family:Inter,Arial,sans-serif}.title{font-size:36px;font-weight:700;letter-spacing:-.8px}.subtitle{font-size:17px}.stage{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <circle cx="80" cy="82" r="7" fill="#dcecff"/><circle cx="106" cy="82" r="7" fill="#dff5ee"/><circle cx="132" cy="82" r="7" fill="#fff0cf"/>
  <text x="80" y="145" class="ink title">Generación y validación de flashcards EdTech</text>
  <text x="80" y="180" class="muted subtitle">El docente controla el contenido publicado; el estudiante repasa únicamente tarjetas aprobadas.</text>
  <g filter="url(#shadow)"><rect x="80" y="245" width="320" height="430" rx="24" fill="#f5f9ff" stroke="#cfe0f7" stroke-width="2"/><rect x="440" y="245" width="320" height="430" rx="24" fill="#f3fbf8" stroke="#cdeee3" stroke-width="2"/><rect x="800" y="245" width="320" height="430" rx="24" fill="#fffaf0" stroke="#f5e1b1" stroke-width="2"/><rect x="1160" y="245" width="360" height="430" rx="24" fill="#fbf7ff" stroke="#e6d8f6" stroke-width="2"/></g>
  <circle cx="124" cy="291" r="22" fill="#3974c7"/><text x="124" y="299" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="20" font-weight="700">1</text><text x="163" y="298" class="ink stage">Solicitud docente</text>
  <text x="112" y="360" class="ink body">Curso, nivel y semana</text><text x="112" y="398" class="ink body">Tema y objetivo del repaso</text><text x="112" y="436" class="ink body">Material adjunto</text><text x="132" y="462" class="muted small">PDF o Word</text><text x="112" y="500" class="ink body">Formato solicitado</text><text x="132" y="526" class="muted small">Pregunta · respuesta · explicación</text><text x="132" y="548" class="muted small">Recurso visual cuando corresponda</text>
  <circle cx="484" cy="291" r="22" fill="#16a67d"/><text x="484" y="299" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="20" font-weight="700">2</text><text x="523" y="298" class="ink stage">Contexto y generación</text>
  <text x="472" y="360" class="ink body">Contexto de la semana</text><text x="472" y="398" class="ink body">Material + instrucción docente</text><line x1="472" y1="425" x2="720" y2="425" stroke="#c7e9dd" stroke-width="2"/><text x="472" y="466" class="ink body">El agente genera</text><text x="472" y="502" class="ink body" font-weight="700">10–20 tarjetas numeradas</text><text x="472" y="548" class="muted small">Cada tarjeta conserva el formato</text><text x="472" y="570" class="muted small">solicitado por el docente.</text>
  <circle cx="844" cy="291" r="22" fill="#d49622"/><text x="844" y="299" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="20" font-weight="700">3</text><text x="883" y="298" class="ink stage">Selección docente</text>
  <text x="832" y="360" class="ink body">Aprobar tarjetas correctas</text><text x="832" y="398" class="ink body">Rechazar las no válidas</text><text x="832" y="436" class="ink body">Explicar ajustes o motivos</text><line x1="832" y1="465" x2="1080" y2="465" stroke="#f0dfb4" stroke-width="2"/><text x="832" y="506" class="ink body">Actualizar el conjunto</text><text x="832" y="542" class="muted small">Solo continúa el contenido</text><text x="832" y="564" class="muted small">validado por el docente.</text>
  <circle cx="1204" cy="291" r="22" fill="#8758b5"/><text x="1204" y="299" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="20" font-weight="700">4</text><text x="1243" y="298" class="ink stage">Entrega al estudiante</text>
  <text x="1192" y="360" class="ink body">Publicar conjunto aprobado</text><text x="1192" y="398" class="ink body">Solicitar repaso</text><text x="1192" y="436" class="ink body">Recibir tarjetas aprobadas</text><text x="1192" y="474" class="ink body">Registrar progreso</text><line x1="1192" y1="505" x2="1472" y2="505" stroke="#e4d7f4" stroke-width="2"/><text x="1192" y="548" class="muted small">Los borradores no se muestran</text><text x="1192" y="570" class="muted small">al estudiante.</text>
  <line x1="402" y1="460" x2="430" y2="460" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/><line x1="762" y1="460" x2="790" y2="460" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/><line x1="1122" y1="460" x2="1150" y2="460" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="80" y="745" width="1440" height="72" rx="18" fill="#f8fafc" stroke="#dbe5ef"/><text x="112" y="788" class="muted body">Reglas: no publica automáticamente · no entrega borradores · no consulta internet fuera de EdTech</text>
</svg>
