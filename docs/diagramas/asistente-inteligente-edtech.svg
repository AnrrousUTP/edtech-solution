<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Asistente inteligente EdTech</title>
  <desc id="desc">Arquitectura por capas del asistente con entrada de texto y voz, contexto, prompt, modelo, guardrails y presenter.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#19324d" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#7593b2"/></marker>
    <style>
      .ink{fill:#142b42;font-family:Inter,Arial,sans-serif}.muted{fill:#61758d;font-family:Inter,Arial,sans-serif}.title{font-size:38px;font-weight:700;letter-spacing:-.8px}.subtitle{font-size:17px}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.tiny{font-size:13px}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="#fff"/>
  <circle cx="90" cy="78" r="7" fill="#dcecff"/><circle cx="116" cy="78" r="7" fill="#dff5ee"/><circle cx="142" cy="78" r="7" fill="#fff0cf"/>
  <text x="90" y="140" class="ink title">Asistente inteligente EdTech</text>
  <text x="90" y="176" class="muted subtitle">Entrada, preparación, prompt y respuesta presentada según el contexto del estudiante.</text>

  <rect x="90" y="230" width="1620" height="178" rx="24" fill="#f7faff" stroke="#d9e6f5" stroke-width="2"/>
  <text x="126" y="274" class="ink head">1. Experiencia y canales</text>
  <rect x="126" y="300" width="220" height="62" rx="14" fill="#fff" stroke="#bcd3f2"/><text x="236" y="337" text-anchor="middle" class="ink body">Consulta escrita</text>
  <rect x="126" y="365" width="220" height="62" rx="14" fill="#fff" stroke="#bcd3f2"/><text x="236" y="402" text-anchor="middle" class="ink body">Consulta por voz</text>
  <rect x="386" y="365" width="260" height="62" rx="14" fill="#fff" stroke="#bcd3f2"/><text x="516" y="394" text-anchor="middle" class="ink body">Texto transcrito</text><text x="516" y="415" text-anchor="middle" class="muted tiny">ElevenLabs · scribe_v2</text>
  <line x1="346" y1="331" x2="680" y2="331" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="346" y1="396" x2="376" y2="396" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M646 396 C680 396 650 331 680 331" fill="none" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="690" y="300" width="300" height="62" rx="14" fill="#fff" stroke="#bcd3f2"/><text x="840" y="329" text-anchor="middle" class="ink body">Chat web</text><text x="840" y="350" text-anchor="middle" class="muted tiny">texto + audio transcrito</text>
  <line x1="990" y1="331" x2="1048" y2="331" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1060" y="300" width="330" height="62" rx="14" fill="#fff" stroke="#bcd3f2"/><text x="1225" y="329" text-anchor="middle" class="ink body">Consulta normalizada</text><text x="1225" y="350" text-anchor="middle" class="muted tiny">historial reciente</text>

  <rect x="90" y="450" width="1620" height="194" rx="24" fill="#f4fbf8" stroke="#cdeee3" stroke-width="2"/>
  <text x="126" y="494" class="ink head">2. Preparación del contexto</text>
  <g filter="url(#shadow)"><rect x="126" y="520" width="246" height="80" rx="14" fill="#fff"/><rect x="398" y="520" width="246" height="80" rx="14" fill="#fff"/><rect x="670" y="520" width="246" height="80" rx="14" fill="#fff"/><rect x="942" y="520" width="246" height="80" rx="14" fill="#fff"/><rect x="1214" y="520" width="246" height="80" rx="14" fill="#fff"/></g>
  <text x="249" y="554" text-anchor="middle" class="ink body">Curso</text><text x="249" y="577" text-anchor="middle" class="muted small">ruta y nivel</text>
  <text x="521" y="554" text-anchor="middle" class="ink body">Semana</text><text x="521" y="577" text-anchor="middle" class="muted small">tema actual</text>
  <text x="793" y="554" text-anchor="middle" class="ink body">Progreso</text><text x="793" y="577" text-anchor="middle" class="muted small">avance del estudiante</text>
  <text x="1065" y="554" text-anchor="middle" class="ink body">Materiales</text><text x="1065" y="577" text-anchor="middle" class="muted small">contenido disponible</text>
  <text x="1337" y="554" text-anchor="middle" class="ink body">Historial</text><text x="1337" y="577" text-anchor="middle" class="muted small">conversación reciente</text>
  <line x1="1460" y1="560" x2="1566" y2="560" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/><text x="1615" y="554" text-anchor="middle" class="muted small">contexto</text><text x="1615" y="575" text-anchor="middle" class="muted small">autorizado</text>

  <rect x="90" y="686" width="1620" height="214" rx="24" fill="#fffaf0" stroke="#f5e1b1" stroke-width="2"/>
  <text x="126" y="730" class="ink head">3. Prompt engineering</text>
  <g filter="url(#shadow)"><rect x="126" y="758" width="230" height="86" rx="14" fill="#fff"/><rect x="384" y="758" width="230" height="86" rx="14" fill="#fff"/><rect x="642" y="758" width="230" height="86" rx="14" fill="#fff"/><rect x="900" y="758" width="230" height="86" rx="14" fill="#fff"/><rect x="1158" y="758" width="230" height="86" rx="14" fill="#fff"/></g>
  <text x="241" y="794" text-anchor="middle" class="ink body">Rol</text><text x="241" y="818" text-anchor="middle" class="muted small">guía académica</text>
  <text x="499" y="794" text-anchor="middle" class="ink body">Contexto</text><text x="499" y="818" text-anchor="middle" class="muted small">datos disponibles</text>
  <text x="757" y="794" text-anchor="middle" class="ink body">Ejemplos</text><text x="757" y="818" text-anchor="middle" class="muted small">respuesta esperada</text>
  <text x="1015" y="794" text-anchor="middle" class="ink body">Restricciones</text><text x="1015" y="818" text-anchor="middle" class="muted small">alcance y no invención</text>
  <text x="1273" y="794" text-anchor="middle" class="ink body">Presenter</text><text x="1273" y="818" text-anchor="middle" class="muted small">texto, lista o acción</text>
  <line x1="1388" y1="801" x2="1494" y2="801" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/><text x="1600" y="795" text-anchor="middle" class="muted small">prompt final</text>

  <rect x="90" y="942" width="1620" height="110" rx="24" fill="#fbf7ff" stroke="#e6d8f6" stroke-width="2"/>
  <text x="126" y="986" class="ink head">4. Modelo y respuesta</text>
  <rect x="390" y="966" width="260" height="52" rx="14" fill="#fff" stroke="#d9c8ed"/><text x="520" y="998" text-anchor="middle" class="ink body">OpenAI · gpt-5-mini</text>
  <line x1="650" y1="992" x2="690" y2="992" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="700" y="966" width="230" height="52" rx="14" fill="#fff" stroke="#d9c8ed"/><text x="815" y="998" text-anchor="middle" class="ink body">Guardrails</text>
  <line x1="930" y1="992" x2="970" y2="992" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="980" y="966" width="230" height="52" rx="14" fill="#fff" stroke="#d9c8ed"/><text x="1095" y="998" text-anchor="middle" class="ink body">Presenter</text>
  <line x1="1210" y1="992" x2="1250" y2="992" stroke="#7593b2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1260" y="966" width="390" height="52" rx="14" fill="#fff" stroke="#d9c8ed"/><text x="1455" y="998" text-anchor="middle" class="ink body">Respuesta breve / siguiente acción</text>
</svg>
