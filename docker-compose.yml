name: edtech

# Perfiles (doc 13 §6): base | pagos | contenido | full.
# Docker Compose no arranca servicios con profile en un `up` sin flags, así que
# "levantar todo" es `docker compose --profile full up` (anotado en DECISIONS.md, A-04).
services:
  postgres:
    image: postgres:16-alpine
    profiles: ["base", "pagos", "contenido", "full"]
    environment:
      POSTGRES_DB: edtech
      POSTGRES_PASSWORD: local
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tools/seed/00-schemas.sql:/docker-entrypoint-initdb.d/00-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 1g

  localstack:
    image: localstack/localstack:3
    profiles: ["base", "pagos", "contenido", "full"]
    environment:
      SERVICES: events,sqs,s3,secretsmanager
      DEBUG: 0
    ports: ["4566:4566"]
    volumes:
      - ./tools/localstack-init:/etc/localstack/init/ready.d

  jwt-local:
    build: ./tools/jwt-local
    profiles: ["base", "pagos", "contenido", "full"]
    ports: ["4599:4599"]

  identity-access:
    build: { context: ., dockerfile: services/identity-access/Dockerfile }
    profiles: ["full"]
    ports: ["3001:3000"]
    mem_limit: 512m
    environment:
      DATABASE_URL: postgres://svc_identity:local@postgres:5432/edtech
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EVENT_BUS_NAME: edtech-domain-events
      QUEUE_URL: http://localstack:4566/000000000000/edtech-dev-identity
      COGNITO_ISSUER: http://jwt-local:4599
      LOG_LEVEL: debug
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_started }
      jwt-local: { condition: service_started }

  enrollment-progress:
    build: { context: ., dockerfile: services/enrollment-progress/Dockerfile }
    profiles: ["pagos", "full"]
    ports: ["3003:3000"]
    mem_limit: 512m
    environment:
      DATABASE_URL: postgres://svc_enrollment:local@postgres:5432/edtech
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EVENT_BUS_NAME: edtech-domain-events
      QUEUE_URL: http://localstack:4566/000000000000/edtech-dev-enrollment
      CATALOG_BASE_URL: http://gateway
      COGNITO_ISSUER: http://jwt-local:4599
      INTERNO_TOKEN: local-interno
      LOG_LEVEL: debug
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_started }
      jwt-local: { condition: service_started }

  flashcards:
    build: { context: ., dockerfile: services/flashcards/Dockerfile }
    profiles: ["contenido", "full"]
    ports: ["3006:3000"]
    mem_limit: 512m
    environment:
      DATABASE_URL: postgres://svc_flashcards:local@postgres:5432/edtech
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EVENT_BUS_NAME: edtech-domain-events
      QUEUE_URL: http://localstack:4566/000000000000/edtech-dev-flashcards
      QUEUE_GENERACION_URL: http://localstack:4566/000000000000/edtech-dev-flashcards-generacion
      GENERADOR_FLASHCARDS: fake
      COGNITO_ISSUER: http://jwt-local:4599
      LOG_LEVEL: debug
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_started }
      jwt-local: { condition: service_started }

  gamification:
    build: { context: ., dockerfile: services/gamification/Dockerfile }
    profiles: ["full"]
    ports: ["3005:3000"]
    mem_limit: 512m
    environment:
      DATABASE_URL: postgres://svc_gamification:local@postgres:5432/edtech
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EVENT_BUS_NAME: edtech-domain-events
      QUEUE_URL: http://localstack:4566/000000000000/edtech-dev-gamification
      QUEUE_CERTIFICADOS_URL: http://localstack:4566/000000000000/edtech-dev-gamification-certificados
      BUCKET_MEDIA: edtech-dev-media
      COGNITO_ISSUER: http://jwt-local:4599
      LOG_LEVEL: debug
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_started }
      jwt-local: { condition: service_started }

  catalog:
    build: { context: ., dockerfile: services/catalog/Dockerfile }
    profiles: ["contenido", "pagos", "full"]
    ports: ["3002:3000"]
    mem_limit: 512m
    environment:
      DATABASE_URL: postgres://svc_catalog:local@postgres:5432/edtech
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EVENT_BUS_NAME: edtech-domain-events
      BUCKET_MEDIA: edtech-dev-media
      COGNITO_ISSUER: http://jwt-local:4599
      INTERNO_TOKEN: local-interno
      LOG_LEVEL: debug
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_started }
      jwt-local: { condition: service_started }

volumes:
  pgdata: {}
