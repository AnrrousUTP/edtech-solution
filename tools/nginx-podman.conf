# Configuración del gateway para Podman rootless en WSL2.
# Netavark expone el DNS de la red en 10.89.0.1.
events {
  worker_connections 1024;
}

http {
  resolver 10.89.0.1 valid=10s;

  server {
    listen 80;
    client_max_body_size 5m;

    location /api/identity/ {
      set $destino http://identity-access:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    location /api/catalog/ {
      set $destino http://catalog:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    location /api/enrollment/ {
      set $destino http://enrollment-progress:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    location /api/gamification/ {
      set $destino http://gamification:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    location /api/flashcards/ {
      set $destino http://flashcards:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    location /api/payments/ {
      set $destino http://payments:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    location / {
      default_type application/json;
      return 404 '{"error":{"code":"NO_ENCONTRADO","message":"Ruta sin servicio"}}';
    }
  }
}
