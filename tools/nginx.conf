# Réplica de las listener rules del ALB (doc 07 §5, doc 13 §2). El frontend usa
# EXACTAMENTE las mismas URLs en local y en AWS: sin una capa de "en local es
# distinto" que después esconda un bug de rutas.
events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s; # DNS de Docker: los servicios pueden arrancar después

  server {
    listen 80;
    client_max_body_size 5m;

    location /api/identity/ {
      set $destino http://identity-access:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    location /api/catalog/ {
      set $destino http://catalog:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    location /api/enrollment/ {
      set $destino http://enrollment-progress:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    location /api/gamification/ {
      set $destino http://gamification:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    location /api/flashcards/ {
      set $destino http://flashcards:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    location /api/payments/ {
      set $destino http://payments:3000;
      proxy_pass $destino;
      include /etc/nginx/proxy_comun.conf;
    }

    # Igual que el ALB: lo que no matchea ninguna regla de /api/ es 404 JSON
    location / {
      default_type application/json;
      return 404 '{"error":{"code":"NO_ENCONTRADO","message":"Ruta sin servicio"}}';
    }
  }
}
